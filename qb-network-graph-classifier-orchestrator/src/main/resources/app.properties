# ============================================================
# QB Network Graph — Classifier Orchestrator
# ============================================================

# -- Paimon --
warehouse.path=/Users/mousammaiti/IntuitQB-StreamHouse
paimon.database=network_graph
source.table=entity_connections

# -- Entity Resolution Agent --
agent.base-url=http://localhost:18181
agent.timeout-ms=60000

# -- Mode --
# batch   — read full table once, classify all, exit
# stream  — tail changelog continuously
mode=batch

# -- Stream mode settings --
poll.interval-ms=2000
checkpoint.dir=.checkpoints

# -- Processing --
# Skip rows where display_name is NULL (partial writes from Job 2)
skip.unnamed=true
# Dry run — classify but don't POST to agent
dry.run=false

# -- Logging --
log.level=INFO
