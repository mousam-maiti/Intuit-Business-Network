# QB Network Graph — Conversational Agent Configuration

server:
  host: "0.0.0.0"
  port: 8082

mcp_server:
  url: "http://localhost:8083/mcp"
  timeout_ms: 30000

llm:
  provider: "gemini"
  model: "gemini-2.5-pro"
  temperature: 0.3
  max_tokens: 4096
  timeout_ms: 30000

mysql:
  host: "localhost"
  port: 3306
  user: "qb_admin"
  password: "qb_admin_pass"
  database: "quickbooks"
  pool_size: 5

context:
  max_messages: 30
  keep_recent: 10
  max_iterations: 8
