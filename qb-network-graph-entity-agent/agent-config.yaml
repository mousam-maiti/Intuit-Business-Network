# Entity Resolution Agent — Configuration
# From design doc §5.3

# Decision thresholds
thresholds:
  auto_merge: 0.85
  human_review: 0.60
  new_entity: 0.60          # below review → NEW ENTITY
  embedding_needed_low: 0.40
  embedding_needed_high: 0.85

# Disqualification rules (hard stops)
disqualifiers:
  ein_mismatch: true
  state_mismatch: true

# Dimension weights (must sum to 1.0)
weights:
  identity: 0.35
  industry: 0.25
  location: 0.15
  commodity: 0.15
  behavioral: 0.10

# Cascade guard
re_evaluation:
  max_chain_depth: 3
  force_review_at_depth: 3

# Bucket configuration
buckets:
  identity:
    - type: name_first_token_state    # "name:BOBS+TX"
    - type: ein                        # "ein:74-884"
    - type: phone                      # "phone:5124551234"
    - type: email_domain               # "email_domain:bobsplumbing.com"
  industry:
    - type: naics4_state               # "naics4:2382+TX"
    - type: naics3_state               # "naics3:238+TX"
  location:
    - type: zip3                       # "zip3:787"
    - type: city_state                 # "city:AUSTIN+TX"
  commodity:
    - type: keyword_state              # "commodity:pvc pipe+TX" (top 3)
  max_commodity_keywords: 3

# LLM configuration (Gemini — same API key as embedding)
llm:
  provider: gemini
  model: gemini-2.5-flash
  ambiguous_model: gemini-2.5-pro
  max_tokens: 1024
  temperature: 0.0
  timeout_ms: 10000
  fallback_decision: REVIEW

# Embedding configuration
embedding:
  provider: gemini
  model: gemini-embedding-001
  dimension: 3072
  task_type: SEMANTIC_SIMILARITY
  batch_size: 10
  fallback_provider: local
  fallback_model: all-MiniLM-L6-v2
  fallback_dimension: 384

# Knowledge Graph Store (GraphDB Free)
knowledge_graph:
  sparql_endpoint: http://localhost:7200/repositories/qb-ontology
  update_endpoint: http://localhost:7200/repositories/qb-ontology/statements
  timeout_ms: 2000
  max_concurrent_queries: 2
  direct_write: true
  fallback_to_changelog: true
  t_box_cache_ttl_hours: 24

# Paimon (Streaming Lakehouse — durable source of truth)
paimon:
  warehouse: /tmp/paimon-warehouse
  catalog_type: filesystem
  database: entity_resolution
  bucket_count: 2
  write_queue_size: 1000
  max_workers: 4

# Observability (OTEL)
telemetry:
  enabled: true
  service_name: qb-entity-resolution-agent
  otlp_endpoint: http://localhost:4317
  export_interval_ms: 15000

# ── MCP Server (candidate eval, entity writer, knowledge graph) ──
mcp_server:
  url: http://localhost:8081/mcp
  timeout_ms: 30000

# ── MySQL (Source of Truth — v3) ────────────────────────────
mysql:
  host: localhost
  port: 3306
  user: qb_admin
  password: qb_admin_pass
  database: quickbooks
  pool_size: 5

# ── Milvus (Vector Search — v3) ────────────────────────────
milvus:
  host: localhost
  port: 19530

# ── Redis (DISABLED — Tier 2 optimization) ─────────────────
redis:
  enabled: false
  host: localhost
  port: 6379
