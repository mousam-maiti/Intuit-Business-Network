databaseChangeLog:
  - changeSet:
      id: 0019-alter-pending-resolution-trigger-type
      author: qb-network-graph
      comment: >
        Add trigger_type column to pending_resolution.
        MCP entity_writer_tools.submit_for_review writes this field.
      changes:
        - addColumn:
            tableName: pending_resolution
            columns:
              - column:
                  name: trigger_type
                  type: VARCHAR(30)
                  defaultValue: "AI_AGENT"
                  afterColumn: key_uncertainty
                  remarks: "LAYER_1_EIN | AI_AGENT_EMBEDDING | AI_AGENT_LLM | RE_EVALUATION"

      rollback:
        - dropColumn:
            tableName: pending_resolution
            columnName: trigger_type
