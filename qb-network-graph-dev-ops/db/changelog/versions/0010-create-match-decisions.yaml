databaseChangeLog:
  - changeSet:
      id: 0010-create-match-decisions
      author: qb-network-graph
      comment: >
        User confirm/reject decisions on entity resolution matches.
        Feedback loop: Pipeline proposes → user decides in Review page →
        decision writes here → CDC → Paimon → golden records updated.
      changes:
        - createTable:
            tableName: match_decisions
            columns:
              - column:
                  name: decision_id
                  type: BIGINT UNSIGNED
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: match_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                  remarks: "References pending_resolution.match_id"
              - column:
                  name: company_id
                  type: BIGINT UNSIGNED
                  constraints:
                    nullable: false
                  remarks: "QB user who made the decision"
              - column:
                  name: decision
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  remarks: "APPROVE, REJECT, SPLIT, OVERRIDE"
              - column:
                  name: reason
                  type: TEXT
                  remarks: "Optional user-provided reason"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - createIndex:
            tableName: match_decisions
            indexName: idx_match_decisions_match
            columns:
              - column:
                  name: match_id
        - createIndex:
            tableName: match_decisions
            indexName: idx_match_decisions_company
            columns:
              - column:
                  name: company_id

      rollback:
        - dropTable:
            tableName: match_decisions
