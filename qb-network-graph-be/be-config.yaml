# QB Network Graph Backend API — Configuration

server:
  host: "0.0.0.0"
  port: 8087

mysql:
  host: localhost
  port: 3306
  user: qb_admin
  password: qb_admin_pass
  database: quickbooks
  pool_size: 5

neo4j:
  uri: "bolt://localhost:7687"
  user: neo4j
  password: neo4j_pass
  database: neo4j
  max_pool_size: 10

entity_agent:
  url: "http://localhost:8085"
  timeout: 30
