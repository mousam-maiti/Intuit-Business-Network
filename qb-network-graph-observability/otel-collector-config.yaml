# ============================================================
# OTEL Collector — Scrapes Flink Prometheus, exports to ES
# ============================================================
# Flink runs natively, exposes Prometheus at :9249/metrics
# Collector runs in Docker, scrapes via host.docker.internal
#
# Pipeline:
#   Flink (:9249) → prometheus scraper → OTEL Collector
#       → metrics: re-exposed at :8889/metrics
#       → logs:    Elasticsearch → Kibana
# ============================================================

receivers:
  # Scrape Flink's Prometheus endpoint
  prometheus:
    config:
      scrape_configs:
        - job_name: 'flink'
          scrape_interval: 15s
          static_configs:
            - targets: ['host.docker.internal:9249']
              labels:
                service: qb-flink-cdc
                environment: local-dev

  # OTLP for any direct exporters (future use)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s

  resource:
    attributes:
      - key: service.name
        value: qb-flink-cdc
        action: upsert
      - key: deployment.environment
        value: local-dev
        action: upsert

exporters:
  # Logs/traces → Elasticsearch → Kibana
  elasticsearch/logs:
    endpoints:
      - http://qb-elasticsearch:9200
    logs_index: flink-logs
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
    retry:
      enabled: true
      initial_interval: 1s
      max_interval: 30s

  # Metrics → Prometheus endpoint (scraped Flink metrics re-exposed)
  # View at: http://localhost:8889/metrics
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [elasticsearch/logs]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
