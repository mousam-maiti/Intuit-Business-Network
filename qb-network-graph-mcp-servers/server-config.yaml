# QB Network Graph MCP Server — Configuration

# MCP Server settings
server:
  host: "0.0.0.0"
  port: 8081
  name: qb-network-graph-mcp

# Decision thresholds
thresholds:
  auto_merge: 0.85
  human_review: 0.60
  new_entity: 0.60
  embedding_needed_low: 0.40
  embedding_needed_high: 0.85

# Dimension weights (must sum to 1.0)
weights:
  identity: 0.35
  industry: 0.25
  location: 0.15
  commodity: 0.15
  behavioral: 0.10

# Cascade guard
re_evaluation:
  max_chain_depth: 3
  force_review_at_depth: 3

# Bucket configuration
buckets:
  max_commodity_keywords: 3

# LLM configuration (Gemini)
llm:
  provider: gemini
  model: gemini-2.5-flash
  ambiguous_model: gemini-2.5-pro
  max_tokens: 1024
  temperature: 0.0
  timeout_ms: 10000
  fallback_decision: REVIEW

# Embedding configuration
embedding:
  provider: gemini
  model: gemini-embedding-001
  dimension: 3072
  task_type: SEMANTIC_SIMILARITY
  batch_size: 10
  fallback_provider: local
  fallback_model: all-MiniLM-L6-v2
  fallback_dimension: 384

# Knowledge Graph Store (GraphDB Free)
knowledge_graph:
  sparql_endpoint: http://localhost:7200/repositories/qb-ontology
  update_endpoint: http://localhost:7200/repositories/qb-ontology/statements
  timeout_ms: 2000
  max_concurrent_queries: 2
  direct_write: true
  fallback_to_changelog: true
  t_box_cache_ttl_hours: 24

# MySQL (Source of Truth)
mysql:
  host: localhost
  port: 3306
  user: qb_admin
  password: qb_admin_pass
  database: quickbooks
  pool_size: 5

# Milvus (Vector Search)
milvus:
  host: localhost
  port: 19530
